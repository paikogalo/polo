<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kawsay Cotopaxi · El volcán está vivo</title>
<meta name="description" content="Kawsay, prototipo de la promoción digital del destino Cotopaxi que propone Hipólito «Polo» Carrera: rutas, 7 cantones, negocios locales y planificador de viajes por voz.">
<meta property="og:title" content="Kawsay Cotopaxi · El volcán está vivo">
<meta property="og:description" content="Planifica tu viaje por Cotopaxi y Ecuador con tu voz. Rutas, cantones y negocios locales.">
<meta property="og:image" content="https://www.depoloapoloavanzamoscotopaxi.com/kawsay/img/hero2.jpg">
<meta property="og:url" content="https://www.depoloapoloavanzamoscotopaxi.com/kawsay">
<meta name="theme-color" content="#183247">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0}[hidden]{display:none!important}

/* Layout: guía de viaje provincial; franjas a todo lo ancho, contenido a 1240px, barra de pestañas inferior en el celular */
:root{
  --noche:#183247; --noche-2:#0B2233; --sol:#F7A713; --laguna:#27A9AD; --fuego:#E63B32;
  --mortino:#73439A; --bosque:#0F6E73; --nieve:#DDF3FA; --mana:#3E8E41;
  --bg:#FFFFFF; --bg-2:#F3F6F8; --line:#E1E7EC; --ink:#183247; --ink-2:#3B4D5E; --ink-3:#5A6B7B;
  --ok-bg:#E3F4EC; --ok:#0B6B4F; --warn-bg:#FFF3DA; --warn:#7A4C00; --err:#B4261D; --err-bg:#FDECEA;
  --display:'Sora', 'Segoe UI', system-ui, sans-serif;
  --body:'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --r:16px; --r-lg:24px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--bosque)}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--laguna);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:18px;height:18px}.ico.lg{width:28px;height:28px}

/* alert + header */
.alert{background:var(--bosque);color:#fff;font-size:15px}
@media (max-width:640px){.alert{font-size:13px}.alert .wrap{padding-block:5px}}
.alert .wrap{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;padding-block:8px}
.alert b{font-weight:700}
.alert button{background:none;border:0;color:#fff;text-decoration:underline;font-weight:700;padding:4px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:72px}
.logo{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.logo .w{display:flex;align-items:baseline;font:800 28px/1 var(--display);letter-spacing:1px}
.logo small{font:700 9px var(--display);letter-spacing:4px;margin-top:5px}
.nav{display:flex;gap:4px;flex:1}
.nav a{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--ink);font:700 15px var(--display)}
.nav a:hover{background:var(--bg-2)}
.nav a[aria-current="page"]{background:var(--noche);color:#fff}
.nav .count{background:var(--fuego);color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.hdr-act{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:0;font:700 15px var(--display);text-decoration:none;white-space:nowrap}
.btn-fuego{background:var(--fuego);color:#fff}.btn-fuego:hover{background:#cf3129}
.btn-noche{background:var(--noche);color:#fff}.btn-noche:hover{background:#0f2536}
.btn-sol{background:var(--sol);color:var(--noche)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid #C7D1DA}.btn-line:hover{border-color:var(--ink)}
.btn-ghost{background:transparent;color:inherit;border:1.5px solid currentColor}
.btn-sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1.5px solid #C7D1DA;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.iconbtn.on{background:var(--fuego);border-color:var(--fuego);color:#fff}

/* bottom tabs (phone) */
.tabs{display:none}
@media (max-width:860px){
  .nav{display:none}
  .hdr .wrap{min-height:62px;justify-content:space-between}
  .hdr-act .btn-fuego{display:none}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:#fff;border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--ink-3);font:700 11px var(--display);border-radius:12px;position:relative}
  .tabs a[aria-current="page"]{color:var(--fuego)}
  .tabs .count{position:absolute;top:2px;right:calc(50% - 22px);background:var(--fuego);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  main{padding-bottom:84px}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom,0px)) !important}
}

/* sections */
.sec{padding-block:56px}
.sec-tight{padding-block:36px}
.sec-alt{background:var(--bg-2)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:24px}
.kicker{font:700 13px var(--display);letter-spacing:3px;text-transform:uppercase;color:var(--fuego)}
.h2{font-size:clamp(26px,3.2vw,36px);font-weight:800;line-height:1.1}
.lead{font-size:19px;color:var(--ink-2);max-width:62ch}
.link{display:inline-flex;align-items:center;gap:6px;font:700 16px var(--display);color:var(--bosque);text-decoration:none;background:none;border:0;padding:8px 0}
.link:hover{text-decoration:underline}

/* hero */
.hero{background:var(--noche);color:#fff}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:0;align-items:stretch}
.hero-txt{padding-block:56px;padding-right:40px;display:flex;flex-direction:column;gap:20px;min-width:0}
.hero h1{font-size:clamp(40px,5.4vw,64px);font-weight:800;line-height:1.02;letter-spacing:-.02em}
.hero h1 span{color:var(--laguna)}
.hero .lead{color:var(--nieve)}
.hero-img{position:relative;min-height:460px;border-radius:0;overflow:hidden}
.cap{position:absolute;left:14px;bottom:14px;background:rgba(11,34,51,.86);color:#fff;font-size:13px;padding:6px 10px;border-radius:8px}
.search{background:#fff;border-radius:20px;padding:8px;display:flex;gap:8px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.search .ico{color:var(--ink-3);margin-left:10px}
.search input{flex:1;min-width:0;border:0;font:500 18px var(--body);color:var(--ink);padding:12px 4px;background:transparent}
.search input:focus{outline:none}
.search:focus-within{outline:3px solid var(--laguna)}
.chips-q{display:flex;flex-wrap:wrap;gap:8px}
.chips-q button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:8px 14px;font:600 14px var(--body)}
.chips-q button:hover{background:rgba(255,255,255,.22)}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:4px}
.stats div{display:flex;flex-direction:column}
.stats b{font:800 30px var(--display);color:var(--sol);font-variant-numeric:tabular-nums}
.stats span{font-size:14px;color:var(--nieve)}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.hero-txt{padding-right:0;padding-block:36px}.hero-img{min-height:260px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}}

/* category tiles */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.cat{display:flex;flex-direction:column;gap:14px;align-items:flex-start;text-align:left;border:0;background:var(--bg-2);border-radius:var(--r);padding:20px;min-height:140px;text-decoration:none;color:var(--ink);transition:transform .15s}
.cat:hover{transform:translateY(-2px);background:#EAF0F4}
.cat .dot{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff}
.cat b{font:700 17px var(--display)}
.cat small{color:var(--ink-3);font-size:14px;margin-top:-8px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:#fff;min-width:0}
.ph{height:170px;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:12px}
.ph .tag{background:rgba(11,34,51,.86);color:#fff;font:600 12px var(--body);padding:4px 9px;border-radius:999px}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:19px;font-weight:700;line-height:1.2}
.card .meta{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:15px}
.card .desc{color:var(--ink-2);font-size:15px}
.card .ft{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font:700 12px var(--body);padding:4px 10px;border-radius:999px;align-self:flex-start}
.b-list{background:#EEF1F4;color:var(--ink-2)}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-rec{background:var(--warn-bg);color:var(--warn)}
.illu{background:linear-gradient(135deg,var(--c1),var(--c2))}
.illu .big{position:absolute;right:14px;top:12px;color:rgba(255,255,255,.9)}
.illu .big .ico{width:44px;height:44px;stroke-width:1.6}
.illu .mono{position:absolute;left:16px;top:10px;font:800 56px/1 var(--display);color:rgba(255,255,255,.28);letter-spacing:-.02em}

/* explorer */
.explore-top{background:var(--noche);color:#fff;padding-block:36px 28px}
.explore-top h1{font-size:clamp(30px,4vw,44px);font-weight:800}
.filters{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.filters .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.row-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:0 15px;border-radius:999px;border:1.5px solid #C7D1DA;background:#fff;font:700 14px var(--display);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--noche);border-color:var(--noche);color:#fff}
.chip .n{font:600 12px var(--body);opacity:.75}
.results-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;color:var(--ink-3)}
.empty{border:2px dashed var(--line);border-radius:var(--r-lg);padding:40px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
@media (max-width:860px){.filters{top:calc(env(safe-area-inset-top,0px) + 62px)}}

/* chugchucaras feature */
.feature{border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1fr 1.2fr;background:var(--fuego);color:#fff}
.feature .txt{padding:36px;display:flex;flex-direction:column;gap:14px}
.feature .list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.feature .list button{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;padding:12px 14px;text-align:left;font:600 16px var(--body)}
.feature .list button:hover{background:rgba(255,255,255,.26)}
.feature .list small{opacity:.85;font-size:13px}
@media (max-width:860px){.feature{grid-template-columns:1fr}.feature .img{min-height:220px}}

/* canton tiles */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ctile{position:relative;min-height:200px;border-radius:20px;overflow:hidden;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;border-bottom:6px solid var(--cc)}
.ctile b{font:800 24px var(--display)}
.ctile span{font-size:14px}
.ctile em{font-style:normal;font:700 12px var(--body);background:rgba(255,255,255,.2);padding:3px 8px;border-radius:999px;align-self:flex-start;margin-bottom:8px}

/* page hero (canton/route) */
.phero{min-height:360px;display:flex;align-items:flex-end;color:#fff;border-bottom:8px solid var(--cc,var(--sol))}
.phero .wrap{width:100%;padding-block:36px;display:flex;flex-direction:column;gap:10px}
.phero h1{font-size:clamp(40px,6vw,68px);font-weight:800;line-height:1}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:8px 14px;font:700 14px var(--display);text-decoration:none}
.ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.ptabs .wrap{display:flex;gap:2px;overflow-x:auto}
.ptabs button{flex:none;min-height:54px;padding:0 16px;border:0;background:none;font:700 15px var(--display);color:var(--ink);border-bottom:3px solid transparent}
.ptabs button[aria-selected="true"]{border-bottom-color:var(--cc);color:var(--ink)}
@media (max-width:860px){.ptabs{top:calc(env(safe-area-inset-top,0px) + 62px)}}

/* route */
.rlayout{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.stops li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-bottom:22px;position:relative}
.stops li::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.stops li:last-child::before{display:none}
.stops .num{width:44px;height:44px;border-radius:50%;background:var(--cc);color:#fff;display:flex;align-items:center;justify-content:center;font:800 16px var(--display)}
.stops .when{font:700 12px var(--display);letter-spacing:2px;text-transform:uppercase;color:var(--ink-3)}
.side{position:sticky;top:110px;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(24,50,71,.08)}
@media (max-width:860px){.rlayout{grid-template-columns:1fr}.side{position:static}}

/* agenda */
.ev{display:grid;grid-template-columns:120px 1fr auto;gap:18px;align-items:center;border:1.5px solid var(--line);border-radius:20px;padding:14px}
.ev .d{border-radius:14px;min-height:96px;display:flex;align-items:flex-end;padding:10px;font:800 15px var(--display);color:#fff;background-size:cover;background-position:center}
@media (max-width:640px){.ev{grid-template-columns:1fr}.ev .d{min-height:140px}}

/* passport */
.pass{background:var(--noche);color:#fff;border-radius:28px;padding:32px;display:flex;flex-wrap:wrap;gap:24px;align-items:center;justify-content:space-between}
.bar{height:14px;border-radius:7px;background:rgba(255,255,255,.18);overflow:hidden;max-width:520px}
.bar i{display:block;height:100%;background:var(--sol);border-radius:7px;transition:width .4s}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.stamp{border-radius:20px;min-height:160px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;border:2px dashed #C7D1DA;color:var(--ink-3);background:#fff;text-align:left;font:inherit}
.stamp.on{border:0;color:#fff;border-bottom:6px solid var(--cc)}
.stamp b{font:800 18px var(--display)}

/* modal */
dialog{border:0;padding:0;border-radius:26px;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.35);color:var(--ink)}
dialog::backdrop{background:rgba(11,34,51,.6)}
.md-ph{height:200px;position:relative}
.md-bd{padding:22px 24px 26px;display:flex;flex-direction:column;gap:12px}
.md-close{position:absolute;right:12px;top:12px;background:#fff;border:0;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:16px}
.kv dt{color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kv dd{margin:0}
.note{background:var(--bg-2);border-radius:14px;padding:14px 16px;font-size:15px;color:var(--ink-2)}
.acts{display:flex;flex-wrap:wrap;gap:10px}

/* form */
.joinwrap{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:start}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;position:sticky;top:100px}
.steps li button{width:100%;display:flex;gap:12px;align-items:center;text-align:left;border:0;background:none;padding:10px 12px;border-radius:14px;font:600 15px var(--body);color:var(--ink-3)}
.steps li button .n{width:32px;height:32px;border-radius:50%;border:2px solid #C7D1DA;display:flex;align-items:center;justify-content:center;font:800 14px var(--display);flex:none}
.steps li.cur button{background:var(--bg-2);color:var(--ink)}
.steps li.cur .n{border-color:var(--fuego);background:var(--fuego);color:#fff}
.steps li.done .n{border-color:var(--bosque);background:var(--bosque);color:#fff}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-lg);padding:28px;display:flex;flex-direction:column;gap:22px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px}
.fgrid .full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:6px}
.f label,.f .lbl{font:700 15px var(--body)}
.f .req{color:var(--fuego)}
.f input,.f select,.f textarea{font:500 17px var(--body);color:var(--ink);padding:12px 14px;border:1.5px solid #C7D1DA;border-radius:12px;background:#fff;width:100%}
.f textarea{min-height:110px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--laguna);box-shadow:0 0 0 3px rgba(39,169,173,.25)}
.f.bad input,.f.bad select,.f.bad textarea{border-color:var(--err)}
.f .err{color:var(--err);font-size:14px;font-weight:600;display:none}
.f.bad .err{display:block}
.f .hint{color:var(--ink-3);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.choice{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px;border:1.5px solid #C7D1DA;border-radius:18px;cursor:pointer;min-height:120px;background:#fff}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice b{font:700 17px var(--display)}
.choice small{color:var(--ink-3);font-size:14px}
.choice:has(input:checked){border-color:var(--noche);background:var(--noche);color:#fff}
.choice:has(input:checked) small{color:var(--nieve)}
.choice:has(input:focus-visible){outline:3px solid var(--laguna)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.ck{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #C7D1DA;border-radius:999px;padding:8px 14px;font:600 15px var(--body);cursor:pointer}
.ck:has(input:checked){border-color:var(--bosque);background:var(--ok-bg);color:var(--ok)}
.ck input{width:18px;height:18px;accent-color:var(--bosque)}
.agree{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #C7D1DA;border-radius:14px;padding:14px 16px;font-size:16px}
.agree input{width:20px;height:20px;margin-top:3px;accent-color:var(--bosque);flex:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.slot{aspect-ratio:1;max-width:100%;border:2px dashed #C7D1DA;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font:600 14px var(--body);color:var(--ink-3);position:relative;overflow:hidden;background:#fff;cursor:pointer}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.slot.has{border-style:solid;border-color:var(--bosque)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .rm{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.slot .lb{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(11,34,51,.86);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px}
.formnav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.progress{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--fuego);transition:width .3s}
.review{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.review div{background:var(--bg-2);border-radius:14px;padding:14px}
.review dt{font:700 12px var(--display);letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3)}
.review dd{margin:4px 0 0;word-break:break-word}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;font-size:15px}
.banner.info{background:#E8F5F6;color:#0A4F52}.banner.warn{background:var(--warn-bg);color:var(--warn)}.banner.err{background:var(--err-bg);color:var(--err)}.banner.ok{background:var(--ok-bg);color:var(--ok)}

/* why join */
.why{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.why div{background:rgba(255,255,255,.08);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px}
.why b{font:700 18px var(--display);color:var(--sol)}

/* chat */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:36;width:64px;height:64px;border-radius:50%;border:0;background:var(--laguna);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(24,50,71,.3)}

.chat-h{background:var(--laguna);color:#062A2C;padding:12px 12px 12px 18px;display:flex;justify-content:space-between;align-items:center}

.chat-h button{background:none;border:0;width:44px;height:44px;color:#062A2C}
.chat-b{padding:14px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--noche);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#EEF8F8;border-bottom-left-radius:4px}
.chat-s{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chat-s button{border:1.5px solid var(--laguna);background:#fff;color:var(--bosque);border-radius:999px;padding:6px 11px;font:700 13px var(--display)}
.chat-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chat-f input{flex:1;min-width:0;border:1.5px solid #C7D1DA;border-radius:999px;padding:10px 14px;font:500 16px var(--body)}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--noche);color:#fff;padding:13px 20px;border-radius:14px;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}

footer{background:var(--noche-2);color:#C3D0DB;font-size:15px}

function compress(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('read'));
    fr.onload = () => { const im = new Image(); im.onerror = () => rej(new Error('img')); im.onload = () => {
      const m = 520, sc = Math.min(1, m / Math.max(im.width, im.height)); const cv = document.createElement('canvas'); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); let q = 0.66, out = cv.toDataURL('image/jpeg', q); while (out.length > 38000 && q > 0.3) { q -= 0.08; out = cv.toDataURL('image/jpeg', q); } res(out); }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

  const w = norm(q).split(/\W+/).filter((x) => x.length > 3 && ['donde', 'comer', 'dormir', 'cerca', 'mejor', 'mejores', 'para'].indexOf(x) < 0);
  let L = allDir().filter((b) => w.some((x) => norm(b.n + ' ' + b.s + ' ' + b.l + ' ' + CK[b.k].n).indexOf(x) >= 0));

async function ask(q) {

function parsePlan(txt) {
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a < 0 || b < a) throw new Error('nojson');
  const o = JSON.parse(txt.slice(a, b + 1));
  if (!o || !Array.isArray(o.opciones) || !o.opciones.length) throw new Error('shape');
  o.opciones.forEach((op) => { op.dias = Array.isArray(op.dias) ? op.dias : []; op.presupuesto = op.presupuesto || {}; op.negocios_cotopaxi = Array.isArray(op.negocios_cotopaxi) ? op.negocios_cotopaxi : []; });
  o.avisos = Array.isArray(o.avisos) ? o.avisos : []; o.contactos = Array.isArray(o.contactos) ? o.contactos : []; o.preguntas = Array.isArray(o.preguntas) ? o.preguntas : [];
  return o;
}
async function makePlan(req, refine) {

      if (r.disponible === false) S.plan = EXAMPLE_PLAN; else { S.plan = parsePlan(JSON.stringify(r.plan)); if (refine) S.planReq = S.planReq + '. ' + req; store.set('planReq', S.planReq); }

function toggleSave(id) {

function copyText(txt, ok) {

  else if (a === 'safety') { toast('Revisa el estado oficial del volcán en el Instituto Geofísico (igepn.edu.ec)'); }
  else if (a === 'quickq') { S.q = el.dataset.q; S.fk = S.fc = S.fs = ''; location.hash = 'explorar'; }
  else if (a === 'gocat') { S.q = ''; S.fk = ''; S.fs = ''; S.fc = el.dataset.c; location.hash = 'explorar'; }
  else if (a === 'gosub') { S.q = ''; S.fk = ''; S.fc = ''; S.fs = el.dataset.s; location.hash = 'explorar'; }
  else if (a === 'fk') { S.fk = el.dataset.v; S.fs = ''; drawExplore(); }
  else if (a === 'fc') { S.fc = el.dataset.v; S.fs = ''; drawExplore(); }
  else if (a === 'fs') { S.fs = el.dataset.v; drawExplore(); }
  else if (a === 'clearf') { S.q = S.fk = S.fc = S.fs = ''; const q = $('#q1'); if (q) q.value = ''; drawExplore(); }
  else if (a === 'ctab') { S.ctab = el.dataset.v; render(true); }
  else if (a === 'saveroute') { const r = ROUTES[+el.dataset.i]; r.biz.map(byName).filter(Boolean).forEach((b) => S.saved.add(b.id)); store.set('saved', [...S.saved]); toast('Ruta guardada en Mi viaje'); render(true); }
  else if (a === 'saveev') { toggleSave('e:' + el.dataset.n); render(true); }
  else if (a === 'stamp') { const k = el.dataset.k; if (S.stamps.has(k)) S.stamps.delete(k); else S.stamps.add(k); store.set('stamps', [...S.stamps]); render(true); if (S.stamps.size === 7) toast('¡Completaste los 7 cantones! Eres Guardián del Cotopaxi'); }
  else if (a === 'copytrip') { copyText('MI VIAJE POR COTOPAXI · Kawsay\n' + [...S.saved].map((x) => { const b = allDir().find((y) => y.id === x); return '• ' + (b ? b.n + ' (' + b.s + ', ' + CK[b.k].n + ')' : x.replace(/^[ve]:/, '').replace(':', ' · ')); }).join('\n'), 'Plan copiado'); }
  else if (a === 'claim') { const b = allDir().find((x) => x.id === id); $('#dlg').close(); S.sent = null; S.form = Object.assign(blankForm(), { nombre: b.n, cat: b.c, sub: b.s, canton: b.k, dir: b.l && b.l !== CK[b.k].n ? b.l : '', claim: b.n }); S.step = 1; saveDraft(); location.hash = 'unete'; if (cur() === 'unete') render(); }
  else if (a === 'gostep') { const n = +el.dataset.n; if (n < S.step || [1, 2, 3, 4].slice(0, n - 1).every(okQuiet)) { S.step = n; saveDraft(); render(); } else toast('Completa los pasos anteriores primero'); }
  else if (a === 'prevstep') { if (S.step === 1) location.hash = 'inicio'; else { S.step--; saveDraft(); render(); } }
  else if (a === 'rmfoto') { e.preventDefault(); S.form.fotos[+el.dataset.i] = null; saveDraft(); render(true); }
  else if (a === 'copyform') { copyText(formText(), 'Solicitud copiada'); }
  else if (a === 'newform') { S.sent = null; S.form = blankForm(); S.step = 1; saveDraft(); render(); }
  else if (a === 'approve') setEstado(id, 'verificado');
  else if (a === 'observe') setEstado(id, 'observado');
  else if (a === 'reject') setEstado(id, 'rechazado');
  else if (a === 'chat') { S.chatOpen = !S.chatOpen; drawChat(); if (S.chatOpen) { const i = $('#chatIn'); if (i) i.focus(); } }
  else if (a === 'ask') ask(el.dataset.q);
  else if (a === 'welcome') openWelcome();
  else if (a === 'draft') openDraft(el.dataset.kind, id);
  else if (a === 'drai') improveDraft(el.dataset.kind, id);
  else if (a === 'drcopy') { const ta = $('#drTxt'); if (ta) copyText(ta.value, 'Mensaje copiado'); }
  else if (a === 'mic') startMic(el);
  else if (a === 'addchip') { const t = $('#' + el.dataset.t); if (t) { t.value = (t.value.trim() ? t.value.trim().replace(/[.,]?$/, ', ') : '') + el.dataset.v; t.focus(); } }
  else if (a === 'plango') { const t = $('#' + el.dataset.t); if (rec) rec.stop(); try { sessionStorage.setItem('kawsay:welcome', '1'); } catch (er) {} if ($('#dlg').open) $('#dlg').close(); makePlan(t ? t.value : ''); }
  else if (a === 'planopt') { S.planOpt = +el.dataset.i; render(true); }
  else if (a === 'refine') { const t = $('#rIn'); if (rec) rec.stop(); makePlan(t ? t.value : '', true); }
  else if (a === 'asesor') { const f = $('#asesorForm'); if (f) { f.scrollIntoView({ behavior: 'smooth', block: 'start' }); const i = $('#f_cn'); if (i) setTimeout(() => i.focus({ preventScroll: true }), 400); } }
  else if (a === 'saveplan') { savePlan(); }
  else if (a === 'copyplan') { copyText(planText(), 'Plan copiado'); }
  else if (a === 'loadplan') { const p = S.planes.find((x) => x.id === id); if (p) { S.plan = p.plan; S.planOpt = p.opt || 0; S.planReq = p.pedido; S.planErr = ''; location.hash = 'planificar'; } }
  else if (a === 'delplan') { S.planes = S.planes.filter((x) => x.id !== id); store.set('planes', S.planes); render(true); }
});
function okQuiet(n) { const F = S.form; if (n === 1) return !!F.perfil; if (n === 2) return F.nombre && F.cat && F.sub && F.canton && F.dir && (F.desc || '').trim().length >= 30; if (n === 3) return F.resp && /^(0?9\d{8}|\+?5939\d{8})$/.test(String(F.wa || '').replace(/[\s-]/g, '')); if (n === 4) return F.fotos[0] && F.fotos[2] && F.autoriza && F.datos; return true; }
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  const k = f.dataset.form;
  if (k === 'search') { S.q = f.querySelector('input').value; S.fk = S.fc = S.fs = ''; location.hash = 'explorar'; }
  else if (k === 'search2') { const q = $('#q1'); if (q) q.blur(); }
  else if (k === 'asesor') { if (canSend()) sendAsesor(f); }
  else if (k === 'chat') { const i = $('#chatIn'); const v = i.value; i.value = ''; ask(v); }
  else if (k === 'join') { if (S.step < 5) { if (validate(S.step)) { S.step++; saveDraft(); render(); } } else if (canSend()) submitForm(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'q1') { S.q = el.value; drawExplore(); return; }
  if (el.dataset.f) { S.form[el.dataset.f] = el.value; const w = $('#w_' + el.dataset.f); if (w) w.classList.remove('bad'); if (el.dataset.f === 'desc') { const c = $('#cnt_desc'); if (c) c.textContent = el.value.length; } saveDraft(); }
});
document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.f) { S.form[el.dataset.f] = el.value; saveDraft(); if (el.dataset.f === 'perfil') { const w = $('#w_perfil'); if (w) w.classList.remove('bad'); } if (el.dataset.f === 'cat') { S.form.sub = S.form.sub || ''; render(true); } }
  else if (el.dataset.fc) { const k = el.dataset.fc; const set = new Set(S.form[k] || []); if (el.checked) set.add(el.value); else set.delete(el.value); S.form[k] = [...set]; saveDraft(); }
  else if (el.dataset.fb) { S.form[el.dataset.fb] = el.checked; const w = $('#w_' + el.dataset.fb); if (w) w.classList.remove('bad'); saveDraft(); }
  else if (el.dataset.foto != null && el.files && el.files[0]) {
    const i = +el.dataset.foto; const file = el.files[0];
    if (!/^image\//.test(file.type)) { toast('Ese archivo no es una imagen'); return; }
    try { toast('Procesando foto…'); S.form.fotos[i] = await compress(file); saveDraft(); render(true); } catch (err) { toast('No pudimos leer esa foto. Prueba con otra.'); }
  }
});
$('#dlg').addEventListener('click', (e) => { if (e.target === $('#dlg')) $('#dlg').close(); });
$('#dlg').addEventListener('close', () => { if (rec) rec.stop(); try { sessionStorage.setItem('kawsay:welcome', '1'); } catch (e) {} $('#dlg').setAttribute('aria-label', 'Ficha del negocio'); });
window.addEventListener('hashchange', () => { if ($('#dlg').open) $('#dlg').close(); render(); const v = $('#view'); if (v) v.focus({ preventScroll: true }); });

/* ---------- capacidades ---------- */
async function initCaps() {
  if (SITE) { S.dbReady = true; return; }
  const use = window.claude && window.claude.use;
  if (!use) { S.dbReady = true; if (['unete', 'panel'].indexOf(cur()) >= 0) render(true); return; }
  const timer = setTimeout(() => { if (!S.dbReady) { S.dbReady = true; if (['unete', 'panel'].indexOf(cur()) >= 0) render(true); } }, 10000);
  try {
    const [db, user, sample] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('sample')]);
    S.db = db; S.user = user; S.sample = sample || null;
    if (user) { S.uid = await user.id(); S.canEdit = !!(await user.canEdit()); }
    if (db) {
      db.collection('publicados').onSnapshot((snap) => {
        S.pub = snap.docs.map((d) => Object.assign({ id: 'p:' + d.id, st: 'ok', f: '' }, d.data())).filter((b) => CK[b.k] && CATS[b.c]);
        const c = cur(); if (c === 'explorar') drawExplore(); else if (c !== 'unete') render(true);
      }, () => {});
      if (S.canEdit) db.collection('consultas').onSnapshot((snap) => { S.cons = snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())); if (cur() === 'panel') render(true); }, () => {});
      if (S.canEdit) db.collection('solicitudes').onSnapshot((snap) => { S.subs = snap.docs.map((d) => Object.assign({ _id: d.id }, d.data())); if (cur() === 'panel') render(true); }, () => {});
      if (S.uid) { try { const mine = await db.doc('solicitudes/' + S.uid).get(); if (mine.exists) { const d = mine.data(); S.prev = '<div class="banner info">' + ico('doc', 'sm') + '<span>Ya enviaste <b>' + esc(d.nombre) + '</b> (' + esc(d.codigo || '') + '). Estado: <b>' + esc(d.estado) + '</b>. Si envías de nuevo, se reemplaza esa solicitud.</span></div>'; } } catch (e) {} }
    }
  } catch (e) {}
  clearTimeout(timer); S.dbReady = true; drawShell();
  if (['unete', 'panel'].indexOf(cur()) >= 0) render(true);
}

render();
initCaps();
(function () { let seen = false; try { seen = sessionStorage.getItem('kawsay:welcome') === '1'; } catch (e) {} if (!seen && ['inicio', ''].indexOf(cur()) >= 0) setTimeout(openWelcome, 700); })();
})();

</script>
